name: UnGathered
description: Fail a pull request when a collection is missing files it should have, such as an image, a credit line or a whole product folder.
author: SoftDevStudio.com
branding:
  icon: check-square
  color: orange

inputs:
  manifest:
    description: The UnGathered manifest (JSON), relative to the workspace. Relative roster files are read from its folder.
    required: true
  root:
    description: Collection folder to scan, relative to the workspace.
    required: false
    default: "."
  args:
    description: More options, as one string (for example `--max-content-bytes 4194304`).
    required: false
    default: ""
  out:
    description: Folder for ungathered.json and ungathered.html. It must be outside root; empty means a folder in the runner's temp directory.
    required: false
    default: ""
  upload:
    description: Upload the reports as a workflow artifact.
    required: false
    default: "true"
  artifact-name:
    description: Name of the uploaded artifact.
    required: false
    default: ungathered-report
  fail:
    description: Fail the step when files are missing. Set to false to report only. A scan that can't finish always fails.
    required: false
    default: "true"
  version:
    description: "UnGathered release to use (v0.2.0 or later), or latest. Empty means the release this action is pinned to (softdevstudio/ungathered@v0.2.0 runs ungathered 0.2.0), else the latest."
    required: false
    default: ""
  ungathered-path:
    description: Use this ungathered binary instead of downloading one (for testing the action itself).
    required: false
    default: ""

outputs:
  result:
    description: pass or fail
    value: ${{ steps.run.outputs.result }}
  exit-code:
    description: "The scan's exit code (0 complete, 1 declared gaps, 2 invalid input or operational errors)"
    value: ${{ steps.run.outputs.exit-code }}
  version:
    description: The release the action ran (a vX.Y.Z tag, latest, or local)
    value: ${{ steps.install.outputs.version }}
  report:
    description: Folder holding ungathered.json and ungathered.html
    value: ${{ steps.run.outputs.report }}

runs:
  using: composite
  steps:
    - name: Install ungathered
      id: install
      shell: bash
      env:
        UG_VERSION: ${{ inputs.version }}
        UG_PATH: ${{ inputs.ungathered-path }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        # github.action_ref is empty on some runners; the env variable is the fallback.
        ACTION_REF="${ACTION_REF:-${GITHUB_ACTION_REF:-}}"
        if [ -z "$UG_VERSION" ]; then
          if [[ "$ACTION_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then UG_VERSION="$ACTION_REF"; else UG_VERSION=latest; fi
        fi
        if [ -n "$UG_PATH" ]; then
          "$UG_PATH" --version
          echo "bin=$UG_PATH" >> "$GITHUB_OUTPUT"
          echo "version=local" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ "$UG_VERSION" != latest ] && ! [[ "$UG_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::version must be latest or a vX.Y.Z tag, not $UG_VERSION"; exit 1
        fi
        case "$RUNNER_OS" in
          Linux) os=linux ;; macOS) os=darwin ;; Windows) os=windows ;;
          *) echo "::error::ungathered has no build for $RUNNER_OS"; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64) arch=amd64 ;; ARM64) arch=arm64 ;;
          *) echo "::error::ungathered has no build for $RUNNER_ARCH"; exit 1 ;;
        esac
        if [ "$os" = windows ] && [ "$arch" != amd64 ]; then echo "::error::ungathered has no Windows $arch build"; exit 1; fi
        ext=tar.gz; [ "$os" = windows ] && ext=zip
        name="ungathered-${os}-${arch}.${ext}"
        if [ "$UG_VERSION" = latest ]; then
          base="https://github.com/softdevstudio/ungathered/releases/latest/download"
        else
          base="https://github.com/softdevstudio/ungathered/releases/download/${UG_VERSION}"
        fi
        dir="$RUNNER_TEMP/ungathered-bin"
        rm -rf "$dir"
        mkdir -p "$dir"
        cd "$dir"
        curl -fsSL --retry 3 -o "$name" "$base/$name" || { echo "::error::could not download $base/$name"; exit 1; }
        curl -fsSL --retry 3 -o SHA256SUMS "$base/SHA256SUMS" || { echo "::error::could not download SHA256SUMS"; exit 1; }
        want=$(awk -v n="$name" '$2==n || $2=="*"n {print $1}' SHA256SUMS)
        if command -v sha256sum >/dev/null; then got=$(sha256sum "$name" | cut -d' ' -f1); else got=$(shasum -a 256 "$name" | cut -d' ' -f1); fi
        if [ -z "$want" ] || [ "$want" != "$got" ]; then echo "::error::$name does not match SHA256SUMS"; exit 1; fi
        if [ "$ext" = zip ]; then unzip -oq "$name"; bin="$dir/ungathered.exe"; else tar -xzf "$name"; bin="$dir/ungathered"; fi
        "$bin" --version
        echo "bin=$bin" >> "$GITHUB_OUTPUT"
        echo "version=$UG_VERSION" >> "$GITHUB_OUTPUT"

    - name: Run ungathered
      id: run
      shell: bash
      env:
        UG_BIN: ${{ steps.install.outputs.bin }}
        IN_MANIFEST: ${{ inputs.manifest }}
        IN_ROOT: ${{ inputs.root }}
        IN_ARGS: ${{ inputs.args }}
        IN_OUT: ${{ inputs.out }}
        IN_FAIL: ${{ inputs.fail }}
        IN_UPLOAD: ${{ inputs.upload }}
      run: |
        # The runner starts bash with -e; a scan with gaps exits 1 and must
        # not end the step before the exit code is recorded.
        set +e -uf
        # A typo in fail must not let gaps pass, so only true and false count.
        for v in "fail=$IN_FAIL" "upload=$IN_UPLOAD"; do
          case "${v#*=}" in true|false) ;; *)
            echo "::error::${v%%=*} must be true or false, not ${v#*=}"
            echo "exit-code=2" >> "$GITHUB_OUTPUT"; echo "result=fail" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
        done
        out="${IN_OUT:-$RUNNER_TEMP/ungathered-report-$GITHUB_ACTION}"
        echo "report=$out" >> "$GITHUB_OUTPUT"
        # ungathered makes a missing out folder itself, after the scan and only
        # outside the root; making it here could put a folder in the collection.
        args=(--manifest "$IN_MANIFEST" --root "$IN_ROOT" --format github --json "$out/ungathered.json" --html "$out/ungathered.html")
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -f "$GITHUB_STEP_SUMMARY" ]; then args+=(--summary "$GITHUB_STEP_SUMMARY"); fi
        # IN_ARGS is split on spaces on purpose: it is a list of options.
        # set -f above keeps a * in it from being expanded as a file pattern.
        # shellcheck disable=SC2206
        if [ -n "$IN_ARGS" ]; then args+=($IN_ARGS); fi
        "$UG_BIN" "${args[@]}"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [ $code = 0 ]; then echo "result=pass" >> "$GITHUB_OUTPUT"; else echo "result=fail" >> "$GITHUB_OUTPUT"; fi
        exit 0

    - name: Upload the reports
      if: ${{ always() && inputs.upload == 'true' && (steps.run.outputs.exit-code == '0' || steps.run.outputs.exit-code == '1' || steps.run.outputs.exit-code == '2') }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ steps.run.outputs.report }}/ungathered.json
          ${{ steps.run.outputs.report }}/ungathered.html
        if-no-files-found: ignore

    - name: Verdict
      shell: bash
      env:
        CODE: ${{ steps.run.outputs.exit-code }}
        FAIL: ${{ inputs.fail }}
      run: |
        case "$CODE" in
          0) echo "ungathered: complete" ;;
          1) if [ "$FAIL" != false ]; then echo "::error::ungathered: files are missing, see the annotations and the job summary"; exit 1; fi
             echo "ungathered found gaps (fail: false, so the step passes)" ;;
          *) echo "::error::ungathered could not finish the scan (exit $CODE); see the log above"; exit 2 ;;
        esac
