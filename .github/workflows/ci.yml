name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "::error::not gofmt-formatted: $out"; exit 1; fi
      - run: sh scripts/record-results.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: test/results/latest
  # Windows archives ship, so the suite runs there too. The race detector
  # needs cgo on Windows, so this job runs without it.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 -v ./... 2>&1 | tee test.log || {
            echo "::error::$(grep -E -- "--- FAIL|panic:|_test.go:[0-9]+:" test.log | head -120 | awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}')"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-log-windows
          path: test.log
